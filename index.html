<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel PRAXIS · Vista previa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#006bc8;--azul-suave:#e8f2fb;--tinta:#1f2328;--gris:#6b7280;--linea:#e5e7eb;--fondo:#f3f4f6;--ambar:#b45309;--verde:#15803d;
  --t-bg:#faf6f0;--t-papel:#f1e9de;--t-tinta:#2b2320;--t-suave:#6f625a;--t-acento:#a9552f;--t-oscuro:#2b2320}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 Inter,system-ui,sans-serif;color:var(--tinta);background:#fff;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
svg{display:block}
.app{height:100dvh;display:grid;grid-template-rows:auto 56px minmax(0,1fr);grid-template-columns:340px minmax(0,1fr);grid-template-areas:"aviso aviso" "barra barra" "panel vista"}

/* aviso de demo */
.aviso{grid-area:aviso;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 16px;background:#0f1d33;color:#fff;font-size:12.5px;text-align:center}
.aviso b{font-weight:600}

/* barra superior: igual a Editar diseño */
.barra{grid-area:barra;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--linea);background:#fff}
.barra-izq{display:flex;align-items:center;gap:12px;width:308px;flex:none}
.barra h1{font-size:14px;font-weight:500;margin:0;white-space:nowrap}
.pildora{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:500;white-space:nowrap}
.pildora::before{content:"";width:6px;height:6px;border-radius:50%;background:#d97706}
.dispositivos{display:flex;padding:2px;border:1px solid #bfd7ee;border-radius:99px}
.dispositivos button{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:13px;color:#374151}
.dispositivos button[aria-pressed=true]{background:var(--azul-suave);color:#004f94}
.barra-der{margin-left:auto;display:flex;align-items:center;gap:16px}
.barra-der button{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;min-height:32px}
.icono-btn{width:32px;height:32px;display:grid!important;place-items:center;border-radius:6px}

/* panel izquierdo */
.panel{grid-area:panel;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--linea);background:#fff}
.panel-cuerpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.panel-pie{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--linea);background:#fff}
.btn{min-height:36px;padding:7px 13px;border-radius:6px;font-size:13px;font-weight:600}
.btn-1{background:var(--azul);color:#fff}
.btn-2{border:1px solid #d1d5db;background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cabeza{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 12px 8px 8px;background:#fff;border-bottom:1px solid var(--linea)}
.cabeza h2{font-size:15px;font-weight:600;margin:0;min-width:0}
.cabeza small{display:block;font-size:12px;font-weight:400;color:var(--gris)}
.seccion-t{margin:16px 16px 6px;font-size:13px;color:var(--gris)}
.fila-menu{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 16px;text-align:left;font-size:14px}
.fila-menu:hover{background:#f9fafb}
.fila-menu>svg:last-child{margin-left:auto;color:#6b7280}
.fila-menu[aria-disabled=true]{color:#6b7280}

/* lista de bloques */
.ayuda-lista{margin:12px 16px;font-size:13px;color:var(--gris)}
.lista{list-style:none;margin:0;padding:0 8px;position:relative}
.fila{display:flex;align-items:center;gap:2px;min-height:48px;margin-bottom:4px;border:1px solid var(--linea);border-radius:8px;background:#fff}
.fila.sel{border-color:var(--azul);box-shadow:inset 0 0 0 1px var(--azul)}
.fila.oculta .fila-nombre{color:#9ca3af}
.fila.arrastrando{position:relative;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.16);background:#fff}
.mango{flex:none;width:32px;height:44px;display:grid;place-items:center;color:#9ca3af;cursor:grab;touch-action:none}
.mango:active{cursor:grabbing}
.fila-abrir{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;gap:7px;text-align:left}
.fila-nombre{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca{flex:none;padding:1px 5px;border-radius:4px;background:#eef1f6;color:#475569;font-size:10px;font-weight:600;letter-spacing:.03em}
.ojo{flex:none;width:36px;height:44px;display:grid;place-items:center;color:#6b7280}
.agregar{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 16px);min-height:44px;margin:8px;border:1px dashed var(--azul);border-radius:8px;color:var(--azul);font-weight:600}
.agregar:hover{background:var(--azul-suave)}

/* formulario */
.form{padding:14px 16px 24px}
.campo{margin-bottom:14px}
.campo-t{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:13px;font-weight:500}
.cuenta{font-size:11.5px;font-weight:400;color:var(--gris);font-variant-numeric:tabular-nums}
.cuenta.pasa{color:var(--ambar)}
.aviso-largo{margin:5px 0 0;font-size:12px;color:var(--ambar)}
input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;font-size:14px}
textarea{min-height:84px;resize:vertical}
.grupo{margin:0 0 12px;padding:10px;border:1px solid var(--linea);border-radius:8px;background:#fafafa}
.grupo-t{display:flex;align-items:center;gap:4px;margin-bottom:8px;font-size:12.5px;font-weight:600}
.grupo-t span{margin-right:auto}
.mini{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--linea);border-radius:6px;background:#fff}
.mini:disabled{opacity:.35;cursor:not-allowed}
.sumar{width:100%;min-height:38px;border:1px solid #d1d5db;border-radius:6px;background:#fff;font-weight:500}
.foto-campo{display:flex;align-items:center;gap:10px}
.foto-campo .muestra{width:64px;height:64px;flex:none;overflow:hidden;border-radius:6px;background:var(--t-papel)}
.foto-campo img,.foto-campo svg{width:100%;height:100%;object-fit:cover}
.foto-campo label{display:inline-block;padding:7px 11px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.foto-campo input{position:absolute;opacity:0;width:1px;height:1px}
.foto-campo input:focus-visible+label{outline:2px solid var(--azul);outline-offset:2px}
.variantes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.variante{display:block;width:100%;padding:4px;border:1px solid var(--linea);border-radius:8px;text-align:left;background:#fff}
.variante[aria-pressed=true]{border-color:var(--azul);box-shadow:inset 0 0 0 1px var(--azul)}
.variante:hover{border-color:#9ca3af}
.variante span{display:block;padding:5px 3px 2px;font-size:12px;font-weight:500}
.mini-vista{position:relative;height:86px;overflow:hidden;border-radius:5px;background:var(--t-bg);pointer-events:none}
.mini-vista>div{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0}
.acciones-bloque{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--linea)}
.link-peligro{min-height:36px;padding:7px 11px;border:1px solid #fecaca;border-radius:6px;color:#b91c1c;font-size:13px;font-weight:500}
.catalogo{padding:12px 16px 24px}
.catalogo h3{margin:16px 0 8px;font-size:13px;font-weight:600}
.catalogo h3:first-child{margin-top:0}
.nota-tn{margin:0 0 14px;padding:9px 11px;border-radius:6px;background:var(--azul-suave);color:#084a85;font-size:12.5px}

/* vista previa */
.vista{grid-area:vista;min-width:0;overflow:auto;background:var(--fondo);overscroll-behavior:contain}
.vista.cel{padding:16px 0}
.marco{min-height:100%;margin:0 auto;background:var(--t-bg);transition:max-width .2s ease}
.vista.cel .marco{max-width:390px;box-shadow:0 2px 14px rgba(0,0,0,.14)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* bloques: recuadro igual al de Tiendanube */
.blk{position:relative;cursor:pointer}
.blk::after{content:"";position:absolute;inset:2px;z-index:8;border-radius:6px;pointer-events:none}
.blk::before{content:"Editar";position:absolute;left:10px;top:10px;z-index:9;display:none;padding:4px 7px;border-radius:6px;background:var(--azul);color:#fff;font:500 13px/1.2 Inter,sans-serif}
@media (hover:hover){.blk:hover::after{border:2px dashed var(--azul)}.blk:hover::before{display:block}}
.blk.sel::after{border:3px solid var(--azul)}
.blk.sel::before{display:block}
.viendo .blk{cursor:default}
.viendo .blk::after,.viendo .blk::before{display:none!important}
.viendo .panel{display:none}
.viendo.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"aviso" "barra" "vista"}
.volver{position:fixed;right:16px;bottom:16px;z-index:40;display:none;padding:11px 16px;border-radius:99px;background:var(--azul);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.viendo .volver{display:block}

/* tienda de ejemplo */
.tienda{container-type:inline-size;color:var(--t-tinta);background:var(--t-bg);font:15px/1.5 Inter,sans-serif}
.tienda *{overflow-wrap:anywhere}
.tienda h2,.tienda h3,.logo{font-family:Fraunces,Georgia,serif;font-weight:400;margin:0}
.pre{white-space:pre-line}
.t-barra{padding:7px 14px;background:var(--t-oscuro);color:#fff;font-size:12.5px;text-align:center}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid #e6dccf}
.logo{font-size:23px}
.t-nav{display:flex;gap:20px;font-size:13.5px}
.t-sec{padding:56px 28px}
.t-tit{font-size:32px;line-height:1.15;margin-bottom:22px!important}
.t-chico{margin:0 0 8px;color:var(--t-acento);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.t-btn{display:inline-block;padding:12px 22px;border-radius:4px;background:var(--t-acento);color:#fff;font-weight:600;font-size:14px}
.t-banner{position:relative;display:flex;align-items:center;min-height:430px;padding:40px 6%;overflow:hidden;background:linear-gradient(115deg,#ead9c5,#d7b597)}
.t-banner-txt{position:relative;z-index:1;width:min(46%,500px)}
.t-banner h2{font-size:50px;line-height:1.05;margin-bottom:14px}
.t-banner p{margin:0 0 22px;font-size:17px}
.t-banner svg{position:absolute;right:7%;bottom:0;width:38%;max-width:430px;height:92%}
.t-benef{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:18px;padding:22px 28px;background:var(--t-papel)}
.t-benef b{display:block;font-size:14px}
.t-benef span{font-size:13px;color:var(--t-suave)}
.t-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.t-cat{overflow:hidden;border-radius:6px;background:var(--t-papel)}
.t-cat svg{width:100%;height:170px}
.t-cat b{display:block;padding:10px 12px;font-weight:500}
.t-prods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.t-prod svg{width:100%;height:230px;border-radius:6px;background:var(--t-papel)}
.t-prod b{display:block;margin-top:10px;font-weight:500}
.t-prod span{color:var(--t-suave);font-size:14px}
.t-ps{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.t-ps.der .t-ps-foto{order:2}
.t-ps-foto{height:390px;overflow:hidden;border-radius:6px;background:var(--t-papel)}
.t-ps-foto img,.t-ps-foto svg{width:100%;height:100%;object-fit:cover}
.t-ps p{margin:0 0 20px;color:var(--t-suave)}
.t-cifras{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:18px}
.t-cifra{padding:22px;border-top:2px solid var(--t-acento)}
.t-cifra b{display:block;font:400 42px/1.05 Fraunces,serif}
.t-cifra span{color:var(--t-suave);font-size:14px}
.oscuro{background:var(--t-oscuro);color:#fff}
.oscuro .t-cifra{border:0;border-radius:8px;background:#3a302b}
.oscuro .t-cifra span,.oscuro p{color:#d9cfc7}
.oscuro .t-chico{color:#e0a27f}
.t-faq details{border-bottom:1px solid #e0d6c8}
.t-faq summary{padding:15px 0;cursor:pointer;font-weight:500}
.t-faq details p{margin:0 0 15px;color:var(--t-suave)}
.t-faq-col{display:grid;grid-template-columns:1fr 1fr;gap:24px 40px}
.t-faq-col b{display:block;margin-bottom:4px;font-weight:600}
.t-faq-col p{margin:0;color:var(--t-suave);font-size:14px}
.t-opis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.t-opi{padding:20px;border-radius:6px;background:var(--t-papel)}
.t-opi p{margin:0 0 12px}
.t-opi b{font-size:13px}
.t-frase{max-width:760px;margin:0 auto;text-align:center}
.t-frase blockquote{margin:0 0 14px;font:400 29px/1.25 Fraunces,serif}
.t-cierre{text-align:center}
.t-cierre p{max-width:520px;margin:0 auto 20px;color:var(--t-suave)}
.oscuro.t-cierre p{color:#d9cfc7}
.t-cinta{padding:13px 18px;background:var(--t-acento);color:#fff;font-weight:500;text-align:center}
.t-cinta.clara{background:var(--t-papel);color:var(--t-tinta)}
.t-pie{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:30px 28px;background:var(--t-oscuro);color:#d9cfc7;font-size:13.5px}
.vacio{padding:26px;border:1px dashed #c8bcae;border-radius:6px;color:var(--t-suave);text-align:center}
@container (max-width:640px){
  .t-sec{padding:38px 18px}
  .t-tit{font-size:26px}
  .t-head{padding:12px 18px}
  .t-nav{display:none}
  .t-banner{display:block;min-height:0;padding:30px 18px 270px}
  .t-banner-txt{width:100%}
  .t-banner h2{font-size:36px}
  .t-banner svg{right:50%;transform:translateX(50%);width:72%;height:255px}
  .t-benef{grid-template-columns:minmax(0,1fr);gap:10px;padding:18px}
  .t-cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t-cat svg{height:120px}
  .t-prods{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .t-prod svg{height:170px}
  .t-ps{grid-template-columns:minmax(0,1fr);gap:20px}
  .t-ps.der .t-ps-foto{order:0}
  .t-ps-foto{height:260px}
  .t-cifras,.t-faq-col{grid-template-columns:minmax(0,1fr)}
  .t-cifra b{font-size:36px}
  .t-frase blockquote{font-size:24px}
  .t-pie{padding:24px 18px}
}

.brindis{position:fixed;left:50%;bottom:20px;z-index:50;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 14px;border-radius:8px;background:#111827;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateX(-50%)}
.brindis[hidden]{display:none}
.brindis button{min-height:28px;color:#93c5fd;font-weight:600;white-space:nowrap}

/* celular: vista arriba, panel abajo, como dos mitades */
@media (max-width:767px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 52px minmax(0,42fr) minmax(0,58fr);grid-template-areas:"aviso" "barra" "vista" "panel"}
  .viendo.app{grid-template-rows:auto 52px minmax(0,1fr)}
  .aviso{font-size:11.5px;padding:6px 12px}
  .barra{gap:8px;padding:0 10px}
  .barra-izq{width:auto;gap:8px;min-width:0}
  .dispositivos,.oculto-cel{display:none!important}
  .panel{border-right:0;border-top:1px solid #cbd5e1}
  .vista.cel{padding:0}
  .panel-pie{padding:8px 12px}
  .barra-der{gap:6px}
  .brindis{bottom:68px;width:max-content}
}
@media (max-width:359px){.aviso span{display:none}.barra h1{font-size:13px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="aviso"><b>Vista previa del Panel PRAXIS.</b> <span>Probá tocar un bloque, arrastrar una fila o sumar uno. Nada se guarda.</span></div>

  <header class="barra">
    <div class="barra-izq">
      <button class="icono-btn" id="cerrar" aria-label="Cerrar editor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h1>Editar diseño</h1>
      <span class="pildora">Borrador</span>
    </div>
    <div class="dispositivos" role="group" aria-label="Tamaño de la vista previa">
      <button id="d-cel" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/></svg>Celulares</button>
      <button id="d-pc" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>Computadoras</button>
    </div>
    <div class="barra-der">
      <button id="ayuda" class="oculto-cel">Ayuda</button>
      <button id="ver-tienda"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>Ver tienda</button>
    </div>
  </header>

  <aside class="panel" aria-label="Panel de edición">
    <div class="panel-cuerpo" id="panel"></div>
    <div class="panel-pie">
      <button class="btn btn-2" id="g-borrador" disabled>Guardar borrador</button>
      <button class="btn btn-1" id="g-publicar" disabled>Publicar cambios</button>
    </div>
  </aside>

  <main class="vista" id="vista" aria-label="Vista previa de la tienda"><div class="marco" id="marco"></div></main>
  <button class="volver" id="volver">Volver al editor</button>
</div>
<div class="brindis" id="brindis" role="status" hidden></div>

<script>
(function () {
  'use strict';
  /* ─── utilidades ─── */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var copia = function (o) { return JSON.parse(JSON.stringify(o)); };
  var I = {
    atras: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
    flecha: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>',
    mango: '<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="4.5" cy="2.5" r="1.3"/><circle cx="9.5" cy="2.5" r="1.3"/><circle cx="4.5" cy="7" r="1.3"/><circle cx="9.5" cy="7" r="1.3"/><circle cx="4.5" cy="11.5" r="1.3"/><circle cx="9.5" cy="11.5" r="1.3"/></svg>',

        datos[c.k].forEach(function (it, i) {
          h += '<div class="grupo"><div class="grupo-t"><span>' + esc(c.l) + ' ' + (i + 1) + '</span>' +
            '<button class="mini" data-lista="' + c.k + '" data-accion="sube" data-i="' + i + '" aria-label="Subir"' + (i === 0 ? ' disabled' : '') + '>' + I.sube + '</button>' +
            '<button class="mini" data-lista="' + c.k + '" data-accion="baja" data-i="' + i + '" aria-label="Bajar"' + (i === datos[c.k].length - 1 ? ' disabled' : '') + '>' + I.baja + '</button>' +
            '<button class="mini" data-lista="' + c.k + '" data-accion="saca" data-i="' + i + '" aria-label="Sacar">' + I.cruz + '</button></div>';
          c.item.forEach(function (sub) { h += campoTexto(sub, it[sub.k], c.k + '.' + i + '.' + sub.k); });
          h += '</div>';
        });
        if (datos[c.k].length < c.tope) { h += '<button class="sumar" data-lista="' + c.k + '" data-accion="suma">Agregar ' + esc(c.l.toLowerCase()) + '</button>'; }
      } else if (c.t === 'foto') {
        h += '<div class="campo"><div class="campo-t">' + esc(c.l) + '</div><div class="foto-campo"><div class="muestra">' + (datos[c.k] ? '<img src="' + esc(datos[c.k]) + '" alt="">' : pieza(2)) + '</div><input type="file" id="foto-' + c.k + '" accept="image/*" data-foto="' + c.k + '"><label for="foto-' + c.k + '">Cambiar foto</label></div></div>';
      } else {
        h += campoTexto(c, datos[c.k], c.k);
      }
    });
    if (!fijo && !T.tn) {
      h += '<div class="acciones-bloque"><button class="btn btn-2" data-original="1">Volver al original</button><button class="link-peligro" data-quitar="1">Quitar bloque</button></div>';
    }
    panel.innerHTML = h + '</div>';
    panel.scrollTop = 0;
  };
  var miniVista = function (tipo, v, datos, ancho) {
    var alto = 86, esc1 = ancho / 1000;
    return '<div class="mini-vista" style="height:' + alto + 'px"><div style="transform:scale(' + esc1 + ')"><div class="tienda">' + DIBUJA[tipo](datos || TIPOS[tipo].base, v) + '</div></div></div>';
  };
  var pCatalogo = function () {
    var h = cabeza('Agregar bloque', 'Elegí un diseño y aparece en tu página', 'inicio') + '<div class="catalogo">';
    CATALOGO.forEach(function (t) {
      var T = TIPOS[t];
      h += '<h3>' + esc(T.nombre) + '</h3><div class="variantes">' + Object.keys(T.variantes).map(function (v) {
        return '<button class="variante" data-sumar="' + t + '" data-v="' + v + '">' + miniVista(t, v, null, 134) + '<span>' + esc(T.variantes[v]) + '</span></button>';
      }).join('') + '</div>';
    });
    panel.innerHTML = h + '</div>';
    panel.scrollTop = 0;
  };
  var mostrar = function (v) {
    estado.vista = v;
    if (v === 'menu') { estado.sel = null; pMenu(); }
    else if (v === 'inicio') { pInicio(); }
    else if (v === 'catalogo') { pCatalogo(); }
    else if (v.indexOf('form:') === 0) { estado.sel = v.slice(5); pForm(estado.sel); }
    pintar();
  };

  /* ─── datos del formulario abierto ─── */
  var datosAbiertos = function () {
    var id = estado.sel;
    if (FIJOS[id]) { return estado.fijos[id]; }
    var b = porId(id);
    return b ? b.datos : null;
  };
  var esquemaAbierto = function () {
    var id = estado.sel;
    if (FIJOS[id]) { return FIJOS[id]; }
    var b = porId(id);
    return b ? TIPOS[b.tipo] : null;
  };
  var pisar = function (d, ruta, valor) {
    var p = ruta.split('.');
    for (var i = 0; i < p.length - 1; i++) { d = d[p[i]]; }
    d[p[p.length - 1]] = valor;
  };

  panel.addEventListener('input', function (e) {
    var ruta = e.target.getAttribute('data-ruta');
    if (!ruta) { return; }
    pisar(datosAbiertos(), ruta, e.target.value);
    var campo = e.target.closest('.campo'), cuenta = $('.cuenta', campo), aviso = $('.aviso-largo', campo);
    var ideal = +cuenta.textContent.split('/')[1], n = e.target.value.length;
    cuenta.textContent = n + '/' + ideal;
    cuenta.classList.toggle('pasa', n > ideal);
    aviso.hidden = n <= ideal;
    ensuciar();
    pintar();
  });
  panel.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-foto');
    if (!k || !e.target.files[0]) { return; }
    datosAbiertos()[k] = URL.createObjectURL(e.target.files[0]);
    ensuciar();
    mostrar(estado.vista);
    irAlBloque(estado.sel);
  });
  panel.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) { return; }
    if (t.hasAttribute('data-igual')) { brindis('Esto queda igual que hoy en Tiendanube.'); return; }
    var ir = t.getAttribute('data-ir');
    if (ir) {
      if (ir === 'inicio' || ir === 'menu' || ir === 'catalogo') { estado.sel = null; }
      mostrar(ir);
      if (ir.indexOf('form:') === 0) { irAlBloque(ir.slice(5)); }
      return;
    }
    if (t.hasAttribute('data-ojo')) {
      var b0 = porId(t.getAttribute('data-ojo'));
      b0.oculto = !b0.oculto;
      ensuciar();
      mostrar('inicio');
      var o = panel.querySelector('[data-ojo="' + b0.id + '"]');
      if (o) { o.focus(); }
      return;
    }
    if (t.hasAttribute('data-variante')) {
      porId(estado.sel).variante = t.getAttribute('data-variante');
      ensuciar();
      mostrar(estado.vista);
      return;
    }
    if (t.hasAttribute('data-lista')) {
      var k = t.getAttribute('data-lista'), acc = t.getAttribute('data-accion'), i = +t.getAttribute('data-i'), lista = datosAbiertos()[k];
      var esq = esquemaAbierto().campos.filter(function (c) { return c.k === k; })[0];
      if (acc === 'suma') { lista.push(copia(esq.nuevo)); }
      if (acc === 'saca') { lista.splice(i, 1); }
      if (acc === 'sube') { lista.splice(i - 1, 0, lista.splice(i, 1)[0]); }
      if (acc === 'baja') { lista.splice(i + 1, 0, lista.splice(i, 1)[0]); }
      ensuciar();
      var pos = panel.scrollTop;
      mostrar(estado.vista);
      panel.scrollTop = pos;
      return;
    }
    if (t.hasAttribute('data-original')) {
      var b1 = porId(estado.sel);
      b1.datos = copia(TIPOS[b1.tipo].base);
      ensuciar();
      mostrar(estado.vista);
      brindis('El bloque volvió al original.');
      return;
    }
    if (t.hasAttribute('data-quitar')) {
      var previo = copia(estado.bloques), nombre = TIPOS[porId(estado.sel).tipo].nombre, idq = estado.sel;
      estado.bloques = estado.bloques.filter(function (x) { return x.id !== idq; });
      estado.sel = null;
      ensuciar();
      mostrar('inicio');
      brindis(nombre + ' quitado.', 'Deshacer', function () { estado.bloques = previo; mostrar('form:' + idq); irAlBloque(idq); });
      return;
    }
    if (t.hasAttribute('data-sumar')) {
      var nb = nuevo(t.getAttribute('data-sumar'), t.getAttribute('data-v'));
      estado.bloques.push(nb);
      ensuciar();
      mostrar('form:' + nb.id);
      irAlBloque(nb.id);
      brindis(TIPOS[nb.tipo].nombre + ' agregado. Ya lo podés editar.');
    }
  });

  /* tocar un bloque en la vista previa abre su sección en el panel */
  marco.addEventListener('click', function (e) {
    if ($('#app').classList.contains('viendo')) { return; }
    e.preventDefault();
    var n = e.target.closest('[data-b]');
    if (n) { mostrar('form:' + n.getAttribute('data-b')); }
  });

  /* ─── arrastrar filas: con mouse, con el dedo y con el teclado ─── */
  var mover = function (id, delta) {
    var i = estado.bloques.map(function (b) { return b.id; }).indexOf(id), j = i + delta;
    if (j < 0 || j >= estado.bloques.length) { return false; }
    estado.bloques.splice(j, 0, estado.bloques.splice(i, 1)[0]);
    return true;
  };
  var activarArrastre = function () {
    var ul = $('#lista');
    if (!ul) { return; }
    Array.prototype.forEach.call(ul.querySelectorAll('.mango'), function (m) {
      m.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') { return; }
        e.preventDefault();
        var id = m.parentNode.getAttribute('data-id');
        if (mover(id, e.key === 'ArrowUp' ? -1 : 1)) {
          ensuciar();
          mostrar('inicio');
          irAlBloque(id);
          panel.querySelector('[data-id="' + id + '"] .mango').focus();
        }
      });
      m.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var fila = m.parentNode, filas = Array.prototype.slice.call(ul.children), desde = filas.indexOf(fila);
        var alto = fila.getBoundingClientRect().height + 4, y0 = e.clientY, s0 = panel.scrollTop, destino = desde;
        fila.classList.add('arrastrando');
        m.setPointerCapture(e.pointerId);
        filas.forEach(function (f) { if (f !== fila) { f.style.transition = 'transform .15s ease'; } });
        var alMover = function (ev) {
          var caja = panel.getBoundingClientRect();
          if (ev.clientY < caja.top + 44) { panel.scrollTop -= 6; }
          if (ev.clientY > caja.bottom - 28) { panel.scrollTop += 6; }
          var dy = ev.clientY - y0 + (panel.scrollTop - s0);
          fila.style.transform = 'translateY(' + dy + 'px)';
          destino = Math.max(0, Math.min(filas.length - 1, desde + Math.round(dy / alto)));
          filas.forEach(function (f, i) {
            if (f === fila) { return; }
            var d = 0;
            if (i > desde && i <= destino) { d = -alto; }
            if (i < desde && i >= destino) { d = alto; }
            f.style.transform = d ? 'translateY(' + d + 'px)' : '';
          });
        };
        var alSoltar = function () {
          m.removeEventListener('pointermove', alMover);
          m.removeEventListener('pointerup', alSoltar);
          m.removeEventListener('pointercancel', alSoltar);
          var id = fila.getAttribute('data-id');
          if (destino !== desde) {
            mover(id, destino - desde);
            ensuciar();
          }
          mostrar('inicio');
          if (destino !== desde) { irAlBloque(id); }
        };
        m.addEventListener('pointermove', alMover);
        m.addEventListener('pointerup', alSoltar);
        m.addEventListener('pointercancel', alSoltar);
      });
    });
  };

  /* ─── barra superior y guardado ─── */
  var dispositivo = function (cel) {
    vista.classList.toggle('cel', cel);
    $('#d-cel').setAttribute('aria-pressed', cel);
    $('#d-pc').setAttribute('aria-pressed', !cel);
  };
  $('#d-cel').addEventListener('click', function () { dispositivo(true); });
  $('#d-pc').addEventListener('click', function () { dispositivo(false); });
  var verTienda = function (si) {
    $('#app').classList.toggle('viendo', si);
    $('#ver-tienda').hidden = si;
    if (si) { $('#volver').focus(); }
  };
  $('#ver-tienda').addEventListener('click', function () { verTienda(true); });
  $('#volver').addEventListener('click', function () { verTienda(false); });
  $('#cerrar').addEventListener('click', function () { brindis('Acá se cerraría el editor. En esta demo no sale de la página.'); });
  $('#ayuda').addEventListener('click', function () { brindis('Tocá un bloque, arrastrá una fila o usá «Agregar bloque».'); });
  var guardar = function (msj) {
    estado.sucio = false;
    $('#g-borrador').disabled = true;
    $('#g-publicar').disabled = true;
    brindis(msj);
  };
  $('#g-borrador').addEventListener('click', function () { guardar('Demo: acá se guardaría el borrador. No se guardó nada.'); });
  $('#g-publicar').addEventListener('click', function () { guardar('Demo: acá se publicaría. No se publicó nada.'); });

  mostrar('inicio');
})();
</script>
